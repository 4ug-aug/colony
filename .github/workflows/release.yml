name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and publish agent image
        uses: docker/build-push-action@v7
        with:
          context: project
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SWEAT_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=agent-image
          cache-to: type=gha,mode=max,scope=agent-image

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read release version
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Restore from main (default branch). Do not save on tags — those caches
      # are ref-scoped and cannot be reused by later releases.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project/gui/src-tauri
          shared-key: tauri-universal
          cache-targets: true
          save-if: false

      - name: Install dependencies
        run: |
          bun install --cwd project --frozen-lockfile
          bun install --cwd project/gui --frozen-lockfile

      - name: Build server archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bundle="sweat-server-$VERSION"
          mkdir -p "release/$bundle/src/server"
          bun build project/gui/src/server/coordinator.ts --target=bun --minify --outfile "release/$bundle/src/server/coordinator.js"
          cp -R project/gui/drizzle "release/$bundle/drizzle"
          cp .env.example "release/$bundle/.env.example"
          cp project/server-release.md "release/$bundle/README.md"
          tar -C release -czf "release/$bundle.tar.gz" "$bundle"

      - name: Set desktop version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' project/gui/src-tauri/tauri.conf.json > tauri.conf.json
          mv tauri.conf.json project/gui/src-tauri/tauri.conf.json

      - name: Build and upload desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: project/gui
          tauriScript: bun run tauri
          args: --target universal-apple-darwin
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          uploadUpdaterJson: false

      - name: Upload server archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$TAG" "release/sweat-server-$VERSION.tar.gz" --clobber
