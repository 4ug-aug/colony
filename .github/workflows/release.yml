name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read release version
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: |
          bun install --cwd project --frozen-lockfile
          bun install --cwd project/gui --frozen-lockfile

      - name: Build server archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bundle="sweat-server-$VERSION"
          mkdir -p "release/$bundle/src/server" "release/$bundle/agent"
          bun build project/gui/src/server/coordinator.ts --target=bun --minify --outfile "release/$bundle/src/server/coordinator.js"
          cp -R project/gui/drizzle "release/$bundle/drizzle"
          cp project/Dockerfile project/package.json project/bun.lock "release/$bundle/agent/"
          cp -R project/roles project/runtime "release/$bundle/agent/"
          cp .env.example "release/$bundle/.env.example"
          cp project/server-release.md "release/$bundle/README.md"
          tar -C release -czf "release/$bundle.tar.gz" "$bundle"

      - name: Set desktop version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' project/gui/src-tauri/tauri.conf.json > tauri.conf.json
          mv tauri.conf.json project/gui/src-tauri/tauri.conf.json

      - name: Build and upload desktop app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: project/gui
          tauriScript: bun run tauri
          args: --target universal-apple-darwin
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          uploadUpdaterJson: false

      - name: Upload server archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$TAG" "release/sweat-server-$VERSION.tar.gz" --clobber
