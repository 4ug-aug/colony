name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --cwd project --frozen-lockfile
          bun install --cwd project/gui --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: |
          bun run --cwd project typecheck
          bun run --cwd project/gui typecheck

  room-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install GUI dependencies
        run: bun install --cwd project/gui --frozen-lockfile

      - name: Benchmark room loading
        run: bun run --cwd project/gui benchmark:room
