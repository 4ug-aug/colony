name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  room-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install GUI dependencies
        run: bun install --cwd project/gui --frozen-lockfile

      - name: Benchmark room loading
        run: bun run --cwd project/gui benchmark:room
