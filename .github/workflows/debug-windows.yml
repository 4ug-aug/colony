name: Debug Windows Build

# Manual builds for diagnosing an installed Windows app. A `--debug` bundle
# enables the web inspector (right-click -> Inspect), which release installers
# do not carry. Pick the branch or tag to build from the Run workflow dialog.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          bun install --cwd project --frozen-lockfile
          bun install --cwd project/gui --frozen-lockfile

      - name: Build debug installers
        run: bun run --cwd project/gui tauri build --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sweat-windows-debug
          path: |
            project/gui/src-tauri/target/debug/bundle/msi/*.msi
            project/gui/src-tauri/target/debug/bundle/nsis/*.exe
          if-no-files-found: error
